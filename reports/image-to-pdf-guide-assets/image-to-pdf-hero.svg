<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Image to PDF browser conversion</title><desc id="desc">JPG, PNG, and WebP images are converted into a PDF in the browser.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b50"/><stop offset="1" stop-color="#39217d"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6c5ce7"/><stop offset="1" stop-color="#15b8a6"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#060b28" flood-opacity=".24"/></filter></defs><rect width="1200" height="620" rx="36" fill="url(#bg)"/><circle cx="1050" cy="90" r="135" fill="#ffffff" opacity=".045"/><circle cx="100" cy="555" r="180" fill="#38d9c0" opacity=".06"/><text x="72" y="92" fill="#a9e7df" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="3">CLICKPDF • IMAGE TO PDF</text><text x="72" y="160" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="700">Turn images into one PDF</text><text x="72" y="204" fill="#d8defc" font-family="Arial,sans-serif" font-size="24">JPG / PNG / WebP · processed in your browser</text><rect x="72" y="250" width="1056" height="290" rx="28" fill="#f8f9ff" filter="url(#shadow)"/><g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><rect x="120" y="302" width="150" height="56" rx="16" fill="#fff2cf"/><text x="195" y="338" fill="#895e00" font-size="24">JPG</text><rect x="120" y="386" width="150" height="56" rx="16" fill="#e5edff"/><text x="195" y="422" fill="#284c9b" font-size="24">PNG</text><rect x="120" y="470" width="150" height="48" rx="16" fill="#d9f5ed"/><text x="195" y="502" fill="#137765" font-size="22">WebP</text></g><path d="M300 410 H470" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><path d="m452 392 20 18-20 18" fill="none" stroke="#18a99b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="500" y="322" width="306" height="176" rx="22" fill="#eef0ff" stroke="#d4d9f6" stroke-width="2"/><rect x="500" y="322" width="306" height="42" rx="22" fill="#242567"/><circle cx="528" cy="343" r="6" fill="#9ee8dc"/><circle cx="550" cy="343" r="6" fill="#aaa5ed"/><circle cx="572" cy="343" r="6" fill="#aaa5ed"/><text x="653" y="407" text-anchor="middle" fill="#25264f" font-family="Arial,sans-serif" font-size="23" font-weight="700">Browser</text><text x="653" y="444" text-anchor="middle" fill="#5a617f" font-family="Arial,sans-serif" font-size="18">Arrange · set page layout · convert</text><path d="M824 410 H910" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/><path d="m892 392 20 18-20 18" fill="none" stroke="#18a99b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M978 328h82l38 38v144a16 16 0 0 1-16 16h-104a16 16 0 0 1-16-16V344a16 16 0 0 1 16-16" fill="#e95b63"/><path d="M1060 328v32a8 8 0 0 0 8 8h30" fill="#f18b8e"/><text x="1030" y="438" fill="#fff" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700">PDF</text><text x="600" y="585" fill="#e1e6ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="18">Selected image files are processed locally; the webpage may still load other resources.</text></svg>