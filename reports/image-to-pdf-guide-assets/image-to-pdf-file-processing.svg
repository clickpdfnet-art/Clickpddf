<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">How ClickPDF Image to PDF handles files</title><desc id="desc">Comparison of a typical cloud-upload flow and ClickPDF's local image conversion, with a note that webpages may make other network requests.</desc><rect width="1200" height="650" rx="32" fill="#f7f8fc"/><text x="600" y="66" text-anchor="middle" fill="#171a39" font-family="Arial,sans-serif" font-size="40" font-weight="700">How image files are processed</text><text x="600" y="103" text-anchor="middle" fill="#5d637c" font-family="Arial,sans-serif" font-size="19">Processing models differ; check each service's privacy details</text><rect x="54" y="145" width="520" height="365" rx="24" fill="#fff2ef" stroke="#f1c4bd" stroke-width="2"/><rect x="626" y="145" width="520" height="365" rx="24" fill="#eaf7f3" stroke="#bce5da" stroke-width="2"/><text x="314" y="190" text-anchor="middle" fill="#922c31" font-family="Arial,sans-serif" font-size="25" font-weight="700">Typical cloud conversion</text><text x="886" y="190" text-anchor="middle" fill="#176b5c" font-family="Arial,sans-serif" font-size="25" font-weight="700">ClickPDF Image to PDF</text><g font-family="Arial,sans-serif"><rect x="112" y="239" width="110" height="90" rx="16" fill="#fff" stroke="#dc8b83" stroke-width="2"/><path d="M137 294l20-23 14 15 13-11 17 19" fill="none" stroke="#b4444a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="146" cy="257" r="6" fill="#d57962"/><text x="167" y="354" text-anchor="middle" fill="#70343a" font-size="15">Your image</text><path d="M237 284h95" stroke="#b4444a" stroke-width="5" stroke-linecap="round"/><path d="m319 272 14 12-14 12" fill="none" stroke="#b4444a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="346" y="239" width="160" height="90" rx="16" fill="#fff" stroke="#dc8b83" stroke-width="2"/><path d="M371 262h110M371 281h110M371 300h75" stroke="#bc7775" stroke-width="5" stroke-linecap="round"/><text x="426" y="354" text-anchor="middle" fill="#70343a" font-size="15">Provider processes file</text><text x="314" y="408" text-anchor="middle" fill="#713b3b" font-size="17">The image is uploaded to the service.</text><text x="314" y="437" text-anchor="middle" fill="#713b3b" font-size="17">Retention and handling depend on that provider.</text><rect x="683" y="239" width="110" height="90" rx="16" fill="#fff" stroke="#69b4a1" stroke-width="2"/><path d="M708 294l20-23 14 15 13-11 17 19" fill="none" stroke="#238b78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="717" cy="257" r="6" fill="#42b79c"/><text x="738" y="354" text-anchor="middle" fill="#245b54" font-size="15">Your image</text><path d="M809 284h95" stroke="#238b78" stroke-width="5" stroke-linecap="round"/><path d="m891 272 14 12-14 12" fill="none" stroke="#238b78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="918" y="239" width="160" height="90" rx="16" fill="#fff" stroke="#69b4a1" stroke-width="2"/><text x="998" y="275" text-anchor="middle" fill="#245b54" font-size="18" font-weight="700">Browser</text><text x="998" y="302" text-anchor="middle" fill="#426c66" font-size="14">creates PDF locally</text><text x="886" y="386" text-anchor="middle" fill="#245b54" font-size="17">Selected image contents are processed</text><text x="886" y="413" text-anchor="middle" fill="#245b54" font-size="17">in your browser, not uploaded for conversion.</text></g><rect x="88" y="535" width="1024" height="82" rx="18" fill="#e9ecf7"/><text x="600" y="568" text-anchor="middle" fill="#282b55" font-family="Arial,sans-serif" font-size="17" font-weight="700">Scope note</text><text x="600" y="594" text-anchor="middle" fill="#505775" font-family="Arial,sans-serif" font-size="15">The webpage may still load site resources or third-party services. Protect PDF encryption is a separate ClickPDF feature.</text></svg>