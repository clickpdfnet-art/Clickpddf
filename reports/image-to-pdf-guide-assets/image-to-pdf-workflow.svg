<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Four-step image to PDF workflow</title><desc id="desc">Select images, arrange pages, choose layout settings, then convert and download.</desc><rect width="1200" height="560" rx="32" fill="#f6f7ff"/><text x="600" y="68" text-anchor="middle" fill="#191b3b" font-family="Arial,sans-serif" font-size="42" font-weight="700">Image to PDF: 4 simple steps</text><text x="600" y="108" text-anchor="middle" fill="#5b617d" font-family="Arial,sans-serif" font-size="20">Review the order and page layout before creating your document</text><g font-family="Arial,sans-serif"><g><rect x="42" y="154" width="255" height="310" rx="22" fill="#fff" stroke="#d8dcf1" stroke-width="2"/><circle cx="82" cy="198" r="24" fill="#5b50d6"/><text x="82" y="206" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">1</text><rect x="127" y="188" width="82" height="88" rx="12" fill="#eef0ff" stroke="#aaaaf0" stroke-width="2"/><path d="M148 247l17-20 13 13 10-11 12 18" fill="none" stroke="#5750c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="155" cy="211" r="5" fill="#17a995"/><text x="169" y="323" text-anchor="middle" fill="#24254d" font-size="23" font-weight="700">Select images</text><text x="169" y="357" text-anchor="middle" fill="#5e6480" font-size="16">Choose JPG/JPEG, PNG,</text><text x="169" y="381" text-anchor="middle" fill="#5e6480" font-size="16">or WebP files</text></g><g><rect x="337" y="154" width="255" height="310" rx="22" fill="#fff" stroke="#d8dcf1" stroke-width="2"/><circle cx="377" cy="198" r="24" fill="#5b50d6"/><text x="377" y="206" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">2</text><rect x="420" y="184" width="88" height="36" rx="8" fill="#ecebff"/><rect x="433" y="231" width="88" height="36" rx="8" fill="#dff7f2"/><rect x="407" y="278" width="88" height="36" rx="8" fill="#fff0d5"/><path d="M531 202v79m-8-10 8 10 8-10" fill="none" stroke="#4c4bb5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="464" y="353" text-anchor="middle" fill="#24254d" font-size="23" font-weight="700">Arrange pages</text><text x="464" y="387" text-anchor="middle" fill="#5e6480" font-size="16">Reorder, rotate, copy,</text><text x="464" y="411" text-anchor="middle" fill="#5e6480" font-size="16">or remove pages</text></g><g><rect x="632" y="154" width="255" height="310" rx="22" fill="#fff" stroke="#d8dcf1" stroke-width="2"/><circle cx="672" cy="198" r="24" fill="#5b50d6"/><text x="672" y="206" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">3</text><rect x="744" y="184" width="75" height="96" rx="8" fill="#f0f2ff" stroke="#9da2dc" stroke-width="2"/><path d="M759 207h45M759 224h45M759 241h33M759 258h40" stroke="#6769b2" stroke-width="5" stroke-linecap="round"/><text x="759" y="323" text-anchor="middle" fill="#24254d" font-size="22" font-weight="700">Set page layout</text><text x="759" y="357" text-anchor="middle" fill="#5e6480" font-size="16">A4 / Letter / Fit to Image,</text><text x="759" y="381" text-anchor="middle" fill="#5e6480" font-size="16">orientation, fit, and margins</text></g><g><rect x="927" y="154" width="231" height="310" rx="22" fill="#fff" stroke="#d8dcf1" stroke-width="2"/><circle cx="967" cy="198" r="24" fill="#5b50d6"/><text x="967" y="206" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">4</text><path d="M1030 190h64v72h-64z" fill="#fff0ef" stroke="#e06c72" stroke-width="3"/><path d="M1042 213h39M1042 228h39M1042 243h28" stroke="#e06c72" stroke-width="4" stroke-linecap="round"/><path d="M1062 271v33m-12-12 12 12 12-12" fill="none" stroke="#15a58e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1042" y="353" text-anchor="middle" fill="#24254d" font-size="22" font-weight="700">Convert &amp; save</text><text x="1042" y="387" text-anchor="middle" fill="#5e6480" font-size="16">Create the PDF, then</text><text x="1042" y="411" text-anchor="middle" fill="#5e6480" font-size="16">download and review it</text></g></g><rect x="175" y="490" width="850" height="42" rx="21" fill="#e5f6f2"/><text x="600" y="517" text-anchor="middle" fill="#25675f" font-family="Arial,sans-serif" font-size="17" font-weight="600">Processing time and batch capacity depend on your browser, device, and image sizes.</text></svg>