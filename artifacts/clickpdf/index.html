    <!-- GitHub Pages SPA 404 Route Restorer -->
    <script type="text/javascript">
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>

    <script type="application/ld+json">

        {
          "@type": "Question",
          "name": "Are my PDF files ever uploaded to a remote server or saved in the cloud?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Never. 100% of the document processing takes place directly inside your web browser. ClickPDF never uploads, transfers, or mirrors your PDF files to any remote server or external cloud storage. When you load a file, it remains exclusively in your device's local memory (RAM) and is purged the moment you close or refresh the page."
          }
        },
        {
          "@type": "Question",
          "name": "How do PDF tools work entirely inside the browser without a backend?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Modern web browsers are capable of running near-native compiled binary instructions using WebAssembly (WASM) and high-speed JavaScript runtimes. ClickPDF executes battle-tested PDF parsing libraries (such as pdf-lib and PDF.js) and Web Workers directly on your local CPU without relying on remote server queues."
          }
        },
        {
          "@type": "Question",
          "name": "Is ClickPDF safe for sensitive legal, financial, and healthcare documents?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Because your files never traverse the public internet to third-party processing servers, your organization avoids third-party data processor risks under GDPR, HIPAA, FERPA, and corporate non-disclosure agreements (NDAs)."
          }
        },
        {
          "@type": "Question",
          "name": "How does client-side OCR extract text from scanned PDFs without cloud AI APIs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our OCR analysis tool uses Tesseract.js compiled into WebAssembly. The browser renders the scanned pages to an in-memory high-resolution canvas, feeds pixel data to a local WebAssembly neural worker, and recognizes text patterns entirely on your machine."
          }
        },
        {
          "@type": "Question",
          "name": "Can I use ClickPDF without an internet connection or on mobile devices?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes! Once the application assets are cached in your browser, the processing engines run entirely on your local machine. You can disconnect your Wi-Fi or turn on Airplane Mode, and tools like Merge, Split, Rotate, Watermark, and Page Count continue functioning normally."
          }
        }
      ]
    }
