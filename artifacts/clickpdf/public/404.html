<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ClickPDF — Loading...</title>
    <script type="text/javascript">
      // GitHub Pages SPA 404 Redirect Script
      // Single Page Apps for GitHub Pages
      // Encodes path and query string so index.html can restore the clean HTML5 route
      var pathSegmentsToKeep = 0;
      var l = window.location;
      var targetUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash;
      l.replace(targetUrl);
    </script>
  </head>
  <body>
    <noscript>
      <meta http-equiv="refresh" content="0;url=/" />
      <p>Redirecting to ClickPDF Home...</p>
    </noscript>
  </body>
</html>
