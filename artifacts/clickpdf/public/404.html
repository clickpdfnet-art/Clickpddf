<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RYEME5P62V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-RYEME5P62V');
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6250344265022238" crossorigin="anonymous"></script>
    <meta name="theme-color" content="#080d20" />
    <title>Page not found | ClickPDF</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #080d20;
        color: #f8fafc;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(ellipse at top, #25145d 0, #080d20 55%);
      }

      main {
        width: min(100%, 520px);
        padding: clamp(28px, 7vw, 48px);
        text-align: center;
        border: 1px solid #28334d;
        border-radius: 24px;
        background: #10182b;
        box-shadow: 0 24px 70px #0006;
      }

      .code {
        margin: 0;
        color: #a99bff;
        font-size: clamp(3.5rem, 18vw, 6rem);
        font-weight: 800;
        line-height: 1;
      }

      h1 { margin: 20px 0 10px; font-size: clamp(1.4rem, 5vw, 2rem); }
      p { margin: 0; color: #b8c2d6; line-height: 1.7; }

      nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border: 1px solid #36425f;
        border-radius: 12px;
        color: #f8fafc;
        font-weight: 650;
        text-decoration: none;
      }

      a:first-child { border-color: transparent; background: #5637ed; }
      a:focus-visible { outline: 3px solid #a99bff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>The address may be incorrect or the page may have moved.</p>
      <nav aria-label="Helpful links">
        <a href="/">Go to homepage</a>
        <a href="/tools/">Browse PDF tools</a>
      </nav>
    </main>
  </body>
</html>
